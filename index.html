<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FS Nakliyat - Araç Takip</title>
    <style>
        :root {
            --primary: #0066CC;
            --primary-hover: #0052A3;
            --bg: #E9ECEF;           
            --card-bg: #F8F9FA;      
            --input-bg: #E2E6EA;     
            --text-main: #212529;    
            --text-secondary: #6C757D;
            --border: #CED4DA;       
            --success: #198754;
            --danger: #DC3545;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #212529;
            letter-spacing: -0.5px;
        }

        .page {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .input-group {
            margin-bottom: 14px;
            width: 100%;
        }

        /* Kesin Çözüm: CSS Grid ile akıllı yan yana / esnek yerleşim */
        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        @media (max-width: 340px) {
            .row-inputs {
                grid-template-columns: 1fr; /* Sadece çok dar ekranlarda alt alta geçer */
            }
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #FFFFFF;
        }

        input[type="date"] {
            font-size: 12px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 10px rgba(0, 102, 204, 0.2);
            transition: background 0.2s;
        }

        .btn-main:hover {
            background: var(--primary-hover);
        }

        .btn-pdf {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.2);
        }

        .btn-main:active, .btn-pdf:active { opacity: 0.85; }

        /* Alt Navigasyon */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #F8F9FA;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px 20px 4px;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #DEE2E6;
            color: var(--text-main);
            padding: 10px 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-top: 1px solid var(--border);
            background: #FFFFFF;
        }

        .btn-action {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .stats-box {
            display: flex;
            background: #E2E8F0;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            justify-content: space-between;
            align-items: center;
        }

        /* PDF Çıktı Modu */
        @media print {
            body { background: white; color: black; padding: 0; }
            .bottom-nav, .input-group, .btn-pdf, header { display: none !important; }
            .glass-card { border: none; box-shadow: none; padding: 0; margin: 0; }
            table { width: 100%; border: 1px solid #ccc; }
            th, td { border: 1px solid #ccc; color: black; background: white !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>FS Nakliyat</h1>
        <span style="font-size: 12px; color: var(--text-secondary);" id="topTarih"></span>
    </header>

    <!-- SAYFA 1: YENİ SEFER BAŞLAT -->
    <div id="page-cikis" class="page active">
        <div class="glass-card">
            <div class="card-title">🚀 Yeni Sefer Çıkışı</div>
            
            <div class="input-group">
                <label>Araç Seçin</label>
                <select id="seferPlakaSec">
                    <option value="">Önce araç ekleyin</option>
                </select>
            </div>

            <div class="input-group">
                <label>Çıkış Yeri / Rota</label>
                <input type="text" id="cikisYeri" placeholder="Örn: İstanbul -> Antalya">
            </div>

            <div class="input-group">
                <label>Çıkış Kilometresi (KM)</label>
                <input type="number" id="cikisKm" placeholder="Örn: 124500">
            </div>

            <button class="btn-main" onclick="yeniSeferBaslat()">Sefer Başlat</button>
        </div>
    </div>

    <!-- SAYFA 2: SEFERİ BİTİR -->
    <div id="page-donus" class="page">
        <div class="glass-card">
            <div class="card-title">🏁 Aktif Seferler & Dönüş İşlemleri</div>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">
                Yoldaki araçların dönüş kilometresini girerek seferi tamamlayın.
            </p>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Araç / Rota</th>
                            <th>Çıkış KM</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="aktifSeferlerBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SAYFA 3: ARAÇLAR -->
    <div id="page-araclar" class="page">
        <div class="glass-card">
            <div class="card-title">🚛 Araç Tanımla</div>
            
            <div class="input-group">
                <label>Araç Plakası</label>
                <input type="text" id="yeniPlaka" placeholder="Örn: 34ABC123" style="text-transform: uppercase;">
            </div>

            <div class="input-group">
                <label>Model / Açıklama</label>
                <input type="text" id="aracModel" placeholder="Örn: Iveco Daily 5m">
            </div>

            <button class="btn-main" onclick="aracTanimla()">Aracı Kaydet</button>
        </div>

        <div class="glass-card">
            <div class="card-title">📌 Kayıtlı Filo</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Plaka</th>
                            <th>Model</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="araclarTabloBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SAYFA 4: GEÇMİŞ & RAPOR & TARİH FİLTRESİ & PDF -->
    <div id="page-gecmis" class="page">
        <div class="glass-card">
            <div class="card-title">📊 Araç Geçmişi & Rapor</div>
            
            <div class="input-group">
                <label>İncelenecek Araç</label>
                <select id="gecmisPlakaSec" onchange="aracGecmisiniYukle()">
                    <option value="">Araç Seçin</option>
                </select>
            </div>

            <!-- Akıllı Izgara Yapısı (Asla Üst Üste Binmez) -->
            <div class="input-group">
                <div class="row-inputs">
                    <div>
                        <label>Başlangıç Tarihi</label>
                        <input type="date" id="tarihBas" onchange="aracGecmisiniYukle()">
                    </div>
                    <div>
                        <label>Bitiş Tarihi</label>
                        <input type="date" id="tarihBit" onchange="aracGecmisiniYukle()">
                    </div>
                </div>
            </div>

            <div class="stats-box">
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 600;">Seçilen Aralık Toplam Yol</span>
                <span style="font-size: 16px; font-weight: 700; color: var(--primary);" id="toplamYolGosterge">0 KM</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Rota</th>
                            <th>Çıkış</th>
                            <th>Dönüş</th>
                            <th>Toplam</th>
                        </tr>
                    </thead>
                    <tbody id="gecmisTabloBody"></tbody>
                </table>
            </div>

            <!-- PDF İNDİR BUTONU -->
            <button class="btn-pdf" onclick="raporuPdfOlarakIndir()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Filtrelenen Raporu PDF Olarak İndir
            </button>
        </div>
    </div>
</div>

<!-- ALT NAVİGASYON ÇUBUĞU -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('cikis', this)">
        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5m14-9h-4V3H9v6H5l7 7 7-7z"/></svg>
        Sefer Başlat
    </button>
    <button class="nav-item" onclick="switchPage('donus', this)">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Seferi Bitir
    </button>
    <button class="nav-item" onclick="switchPage('araclar', this)">
        <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.76l.12.34V17z"/></svg>
        Araçlar
    </button>
    <button class="nav-item" onclick="switchPage('gecmis', this)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        Raporlar
    </button>
</nav>

<script>
    document.getElementById('topTarih').innerText = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

    let araclar = JSON.parse(localStorage.getItem('fs_araclar')) || [];
    let seferler = JSON.parse(localStorage.getItem('fs_seferler')) || [];

    function verileriKaydet() {
        localStorage.setItem('fs_araclar', JSON.stringify(araclar));
        localStorage.setItem('fs_seferler', JSON.stringify(seferler));
        arayuzuYenile();
    }

    function switchPage(pageId, btnElement) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        document.getElementById('page-' + pageId).classList.add('active');
        btnElement.classList.add('active');
    }

    function aracTanimla() {
        let plakaInput = document.getElementById('yeniPlaka');
        let modelInput = document.getElementById('aracModel');
        let plaka = plakaInput.value.toUpperCase().trim();
        let model = modelInput.value.trim();

        if(!plaka) {
            alert("Lütfen araç plakasını boş bırakmayın.");
            return;
        }

        if(araclar.some(a => a.plaka === plaka)) {
            alert("Bu plaka sistemde zaten kayıtlı.");
            return;
        }

        araclar.push({ plaka, model });
        plakaInput.value = '';
        modelInput.value = '';
        verileriKaydet();
        alert("Araç başarıyla kaydedildi.");
    }

    function aracSil(plaka) {
        if(confirm(`${plaka} plakalı aracı silmek istiyor musunuz?`)) {
            araclar = araclar.filter(a => a.plaka !== plaka);
            verileriKaydet();
        }
    }

    function yeniSeferBaslat() {
        let plaka = document.getElementById('seferPlakaSec').value;
        let yer = document.getElementById('cikisYeri').value.trim();
        let cikisKm = parseFloat(document.getElementById('cikisKm').value);

        if(!plaka || !yer || isNaN(cikisKm)) {
            alert("Lütfen tüm alanları eksiksiz doldurun.");
            return;
        }

        let simdi = new Date();
        let yeniSefer = {
            id: Date.now(),
            plaka,
            yer,
            tarihStr: simdi.toLocaleDateString('tr-TR'),
            tarihIso: simdi.toISOString().split('T')[0],
            cikisKm,
            donusKm: null,
            toplamKm: null
        };

        seferler.unshift(yeniSefer);
        document.getElementById('cikisYeri').value = '';
        document.getElementById('cikisKm').value = '';
        verileriKaydet();
        alert("Sefer başarıyla başlatıldı!");
    }

    function donusKilometresiAl(id) {
        let sefer = seferler.find(s => s.id === id);
        if(!sefer) return;

        let giris = prompt(`${sefer.plaka} (${sefer.yer}) için Dönüş Kilometresini giriniz:`, sefer.cikisKm);
        if(giris === null) return;

        let donusKm = parseFloat(giris);
        if(isNaN(donusKm) || donusKm < sefer.cikisKm) {
            alert("Hata: Dönüş kilometresi çıkış kilometresinden düşük olamaz!");
            return;
        }

        sefer.donusKm = donusKm;
        sefer.toplamKm = donusKm - sefer.cikisKm;
        verileriKaydet();
        alert("Sefer tamamlandı ve kaydedildi!");
    }

    function raporuPdfOlarakIndir() {
        let secilenPlaka = document.getElementById('gecmisPlakaSec').value;
        if(!secilenPlaka) {
            alert("Lütfen önce PDF raporunu indirmek istediğiniz aracı seçin.");
            return;
        }
        window.print();
    }

    function arayuzuYenile() {
        let sel1 = document.getElementById('seferPlakaSec');
        let sel2 = document.getElementById('gecmisPlakaSec');
        let val1 = sel1.value;
        let val2 = sel2.value;

        sel1.innerHTML = '<option value="">Araç Seçiniz</option>';
        sel2.innerHTML = '<option value="">Araç Seçiniz</option>';

        let aracBody = document.getElementById('araclarTabloBody');
        aracBody.innerHTML = araclar.length === 0 ? '<tr><td colspan="3" style="text-align:center; color:var(--text-secondary);">Kayıtlı araç bulunmuyor</td></tr>' : '';

        araclar.forEach(a => {
            sel1.innerHTML += `<option value="${a.plaka}">${a.plaka} ${a.model ? '- '+a.model : ''}</option>`;
            sel2.innerHTML += `<option value="${a.plaka}">${a.plaka} ${a.model ? '- '+a.model : ''}</option>`;
            aracBody.innerHTML += `
                <tr>
                    <td><strong>${a.plaka}</strong></td>
                    <td>${a.model || '-'}</td>
                    <td><button class="btn-danger" onclick="aracSil('${a.plaka}')">Sil</button></td>
                </tr>
            `;
        });

        sel1.value = val1;
        sel2.value = val2;

        let aktifBody = document.getElementById('aktifSeferlerBody');
        let aktifSeferler = seferler.filter(s => s.donusKm === null);
        
        aktifBody.innerHTML = aktifSeferler.length === 0 ? '<tr><td colspan="3" style="text-align:center; color:var(--text-secondary);">Yolda aktif sefer bulunmuyor</td></tr>' : '';

        aktifSeferler.forEach(s => {
            aktifBody.innerHTML += `
                <tr>
                    <td><strong>${s.plaka}</strong><br><small style="color:var(--text-secondary);">${s.yer}</small></td>
                    <td>${s.cikisKm.toLocaleString()} KM</td>
                    <td><button class="btn-action" onclick="donusKilometresiAl(${s.id})">Dönüş Gir</button></td>
                </tr>
            `;
        });

        aracGecmisiniYukle();
    }

    function aracGecmisiniYukle() {
        let secilenPlaka = document.getElementById('gecmisPlakaSec').value;
        let basTarih = document.getElementById('tarihBas').value;
        let bitTarih = document.getElementById('tarihBit').value;
        let gecmisBody = document.getElementById('gecmisTabloBody');
        gecmisBody.innerHTML = '';

        if(!secilenPlaka) {
            document.getElementById('toplamYolGosterge').innerText = '0 KM';
            gecmisBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-secondary);">Lütfen araç seçin</td></tr>';
            return;
        }

        let filtrelenenSeferler = seferler.filter(s => {
            if(s.plaka !== secilenPlaka) return false;
            let seferTarih = s.tarihIso || '';
            if(basTarih && seferTarih < basTarih) return false;
            if(bitTarih && seferTarih > bitTarih) return false;
            return true;
        });

        let toplamYol = 0;

        if(filtrelenenSeferler.length === 0) {
            gecmisBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-secondary);">Seçilen kriterlere uygun sefer bulunamadı</td></tr>';
            document.getElementById('toplamYolGosterge').innerText = '0 KM';
            return;
        }

        filtrelenenSeferler.forEach(s => {
            if(s.toplamKm !== null) toplamYol += s.toplamKm;
            gecmisBody.innerHTML += `
                <tr>
                    <td><small>${s.tarihStr || s.tarih}</small></td>
                    <td>${s.yer}</td>
                    <td>${s.cikisKm.toLocaleString()}</td>
                    <td>${s.donusKm !== null ? s.donusKm.toLocaleString() : 'Yolda'}</td>
                    <td><strong>${s.toplamKm !== null ? s.toplamKm.toLocaleString() + ' km' : '-'}</strong></td>
                </tr>
            `;
        });

        document.getElementById('toplamYolGosterge').innerText = toplamYol.toLocaleString() + ' KM';
    }

    window.onload = arayuzuYenile;
</script>

</body>
</html>
