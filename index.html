<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç Takip Sistemi</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --border: #C6C6C8;
            --success: #34C759;
            --danger: #FF3B30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .tabs {
            display: flex;
            background: #E5E5EA;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            color: #3A3A3C;
        }
        .tab.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--primary);
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: #FAFAFC;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 14px;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
        .btn-sil {
            background-color: var(--danger);
            padding: 4px 8px;
            font-size: 11px;
            width: auto;
            margin: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        th {
            background-color: #E5E5EA;
        }
        .aktif-satir {
            background-color: #FFF3CD;
        }
        .btn-kapat {
            background-color: var(--success);
            padding: 4px 8px;
            font-size: 11px;
            margin: 0;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 Araç Takip Sistemi</h2>

    <div class="tabs">
        <div class="tab active" onclick="sekmeDegistir('seferler')">Seferler</div>
        <div class="tab" onclick="sekmeDegistir('araclar')">Araç Paneli</div>
        <div class="tab" onclick="sekmeDegistir('gecmis')">Araç Geçmişi</div>
    </div>

    <!-- 1. SEFERLER SEKMESİ -->
    <div id="seferler-secim" class="section active">
        <div class="card">
            <h3>Yeni Sefer Çıkışı</h3>
            <label>Araç Seçin</label>
            <select id="seferPlakaSec">
                <option value="">Önce Araç Ekleyin</option>
            </select>
            
            <label>Çıkış Yeri</label>
            <input type="text" id="cikisYeri" placeholder="Örn: Ankara / İstanbul">
            
            <label>Çıkış Kilometresi (KM)</label>
            <input type="number" id="cikisKm" placeholder="Örn: 45000">

            <button type="button" onclick="seferEkle()">Çıkış Kaydı Oluştur</button>
        </div>

        <div class="card">
            <h3>Aktif ve Son Seferler</h3>
            <div style="overflow-x:auto;">
                <table id="seferTablosu">
                    <thead>
                        <tr>
                            <th>Plaka/Yer</th>
                            <th>Çıkış KM</th>
                            <th>Dönüş KM</th>
                            <th>Toplam</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 2. ARAÇ YÖNETİMİ PANELİ -->
    <div id="araclar-secim" class="section">
        <div class="card">
            <h3>Yeni Araç Tanımla</h3>
            <label>Araç Plakası</label>
            <input type="text" id="yeniPlaka" placeholder="Örn: 34ABC123">
            <label>Araç Açıklaması / Model (İsteğe bağlı)</label>
            <input type="text" id="aracModel" placeholder="Örn: Iveco Daily 5m">
            <button type="button" onclick="aracEkle()">Aracı Kaydet</button>
        </div>

        <div class="card">
            <h3>Kayıtlı Araçlar</h3>
            <div style="overflow-x:auto;">
                <table id="aracListesiTablosu">
                    <thead>
                        <tr>
                            <th>Plaka</th>
                            <th>Model/Açıklama</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 3. ARAÇ GEÇMİŞİ SEKMESİ -->
    <div id="gecmis-secim" class="section">
        <div class="card">
            <h3>Araç Bazlı Rapor & Geçmiş</h3>
            <label>İncelenecek Aracı Seçin</label>
            <select id="gecmisPlakaSec" onchange="aracGecmisiniGoster()">
                <option value="">Araç Seçin</option>
            </select>

            <p id="aracToplamYol" style="font-weight: bold; margin-top: 15px; color: var(--primary);"></p>
            
            <div style="overflow-x:auto;">
                <table id="gecmisTablosu">
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Çıkış Yeri</th>
                            <th>Çıkış KM</th>
                            <th>Dönüş KM</th>
                            <th>Toplam KM</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // Verileri localStorage'dan güvenli çekme
    let araclar = [];
    let seferler = [];

    try {
        araclar = JSON.parse(localStorage.getItem('arac_filosu')) || [];
        seferler = JSON.parse(localStorage.getItem('arac_seferleri')) || [];
    } catch (e) {
        araclar = [];
        seferler = [];
    }

    function veriKaydet() {
        try {
            localStorage.setItem('arac_filosu', JSON.stringify(araclar));
            localStorage.setItem('arac_seferleri', JSON.stringify(seferler));
        } catch (e) {
            alert("Kayıt sırasında hata oluştu: " + e.message);
        }
        ekranlariGuncelle();
    }

    function sekmeDegistir(isim) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        if(isim === 'seferler') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('seferler-secim').classList.add('active');
        } else if(isim === 'araclar') {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('araclar-secim').classList.add('active');
        } else if(isim === 'gecmis') {
            document.querySelectorAll('.tab')[2].classList.add('active');
            document.getElementById('gecmis-secim').classList.add('active');
        }
    }

    function aracEkle() {
        let plakaInput = document.getElementById('yeniPlaka');
        let modelInput = document.getElementById('aracModel');
        
        let plaka = plakaInput.value.toUpperCase().trim();
        let model = modelInput.value.trim();

        if(!plaka) {
            alert("Lütfen araç plakasını boş bırakmayın!");
            return;
        }

        // Zaten var mı kontrolü
        let varMi = araclar.some(a => a.plaka === plaka);
        if(varMi) {
            alert("Bu plaka sistemde zaten kayıtlı!");
            return;
        }

        araclar.push({ plaka: plaka, model: model });
        plakaInput.value = '';
        modelInput.value = '';
        
        veriKaydet();
        alert("Araç başarıyla kaydedildi!");
    }

    function aracSil(plaka) {
        if(confirm(`${plaka} plakalı aracı silmek istediğinize emin misiniz?`)) {
            araclar = araclar.filter(a => a.plaka !== plaka);
            veriKaydet();
        }
    }

    function seferEkle() {
        let plaka = document.getElementById('seferPlakaSec').value;
        let cikisYeri = document.getElementById('cikisYeri').value.trim();
        let cikisKm = parseFloat(document.getElementById('cikisKm').value);

        if(!plaka) {
            alert("Lütfen bir araç seçin!");
            return;
        }
        if(!cikisYeri || isNaN(cikisKm)) {
            alert("Lütfen çıkış yerini ve geçerli bir çıkış kilometresi girin!");
            return;
        }

        let yeniSefer = {
            id: Date.now(),
            plaka: plaka,
            yer: cikisYeri,
            tarih: new Date().toISOString().split('T')[0],
            cikisKm: cikisKm,
            donusKm: null,
            toplamKm: null
        };

        seferler.unshift(yeniSefer);
        document.getElementById('cikisYeri').value = '';
        document.getElementById('cikisKm').value = '';
        veriKaydet();
        alert("Çıkış kaydı oluşturuldu!");
    }

    function donusGir(id) {
        let sefer = seferler.find(s => s.id === id);
        if(!sefer) return;
        
        let girilenDonus = prompt(`${sefer.plaka} - ${sefer.yer} için Dönüş Kilometresini girin:`, sefer.cikisKm);
        
        if (girilenDonus === null) return;
        let donusKm = parseFloat(girilenDonus);

        if (isNaN(donusKm) || donusKm < sefer.cikisKm) {
            alert("Hata: Dönüş kilometresi çıkış kilometresinden küçük olamaz!");
            return;
        }

        sefer.donusKm = donusKm;
        sefer.toplamKm = donusKm - sefer.cikisKm;
        veriKaydet();
    }

    function ekranlariGuncelle() {
        // Araç Seçim Kutularını Güncelle
        let secim1 = document.getElementById('seferPlakaSec');
        let secim2 = document.getElementById('gecmisPlakaSec');
        
        let secili1 = secim1.value;
        let secili2 = secim2.value;

        secim1.innerHTML = '<option value="">Araç Seçin</option>';
        secim2.innerHTML = '<option value="">Araç Seçin</option>';

        let aracTbody = document.querySelector('#aracListesiTablosu tbody');
        aracTbody.innerHTML = '';

        if(araclar.length === 0) {
            aracTbody.innerHTML = `<tr><td colspan="3" style="color: #888;">Henüz kayıtlı araç yok.</td></tr>`;
        } else {
            araclar.forEach(a => {
                secim1.innerHTML += `<option value="${a.plaka}">${a.plaka} ${a.model ? '('+a.model+')' : ''}</option>`;
                secim2.innerHTML += `<option value="${a.plaka}">${a.plaka} ${a.model ? '('+a.model+')' : ''}</option>`;
                
                aracTbody.innerHTML += `
                    <tr>
                        <td><b>${a.plaka}</b></td>
                        <td>${a.model || '-'}</td>
                        <td><button type="button" class="btn-sil" onclick="aracSil('${a.plaka}')">Sil</button></td>
                    </tr>
                `;
            });
        }

        // Seçimleri koru
        secim1.value = secili1;
        secim2.value = secili2;

        // Seferler Tablosu
        let seferTbody = document.querySelector('#seferTablosu tbody');
        seferTbody.innerHTML = '';

        if(seferler.length === 0) {
            seferTbody.innerHTML = `<tr><td colspan="5" style="color: #888;">Henüz sefer kaydı yok.</td></tr>`;
        } else {
            seferler.forEach(s => {
                let tr = document.createElement('tr');
                if(s.donusKm === null) tr.classList.add('aktif-satir');

                let islemBtn = s.donusKm === null 
                    ? `<button type="button" class="btn-kapat" onclick="donusGir(${s.id})">Dönüş Gir</button>` 
                    : 'Tamamlandı';

                tr.innerHTML = `
                    <td style="text-align:left"><b>${s.plaka}</b><br><small>${s.yer}</small></td>
                    <td>${s.cikisKm}</td>
                    <td>${s.donusKm !== null ? s.donusKm : '-'}</td>
                    <td><b>${s.toplamKm !== null ? s.toplamKm + ' km' : '-'}</b></td>
                    <td>${islemBtn}</td>
                `;
                seferTbody.appendChild(tr);
            });
        }

        aracGecmisiniGoster();
    }

    function aracGecmisiniGoster() {
        let secilenPlaka = document.getElementById('gecmisPlakaSec').value;
        let tbody = document.querySelector('#gecmisTablosu tbody');
        tbody.innerHTML = '';
        
        if(!secilenPlaka) {
            document.getElementById('aracToplamYol').innerText = '';
            tbody.innerHTML = `<tr><td colspan="5" style="color: #888;">Lütfen yukarıdan araç seçin.</td></tr>`;
            return;
        }

        let aracSeferleri = seferler.filter(s => s.plaka === secilenPlaka);
        let toplamYol = 0;

        if(aracSeferleri.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="color: #888;">Bu araca ait sefer geçmişi bulunamadı.</td></tr>`;
            document.getElementById('aracToplamYol').innerText = `${secilenPlaka} - Toplam Yol: 0 KM`;
            return;
        }

        aracSeferleri.forEach(s => {
            if(s.toplamKm !== null) toplamYol += s.toplamKm;
            tbody.innerHTML += `
                <tr>
                    <td>${s.tarih}</td>
                    <td>${s.yer}</td>
                    <td>${s.cikisKm}</td>
                    <td>${s.donusKm !== null ? s.donusKm : 'Devam Ediyor'}</td>
                    <td><b>${s.toplamKm !== null ? s.toplamKm + ' km' : '-'}</b></td>
                </tr>
            `;
        });

        document.getElementById('aracToplamYol').innerText = `${secilenPlaka} Toplam Yapılan Yol: ${toplamYol} KM`;
    }

    // Sayfa açıldığında verileri ekrana yükle
    window.onload = function() {
        ekranlariGuncelle();
    };
</script>

</body>
</html>
