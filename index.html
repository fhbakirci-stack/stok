<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FS Nakliyat - Araç Takip</title>
    <style>
        :root {
            --primary: #0A84FF;
            --primary-dark: #0056B3;
            --bg: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-secondary: #8E8E93;
            --border: #38383A;
            --success: #32D74B;
            --danger: #FF453A;
            --warning: #FFD60A;
            --radius: 14px;
        }
        
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #F2F2F7;
                --card-bg: #FFFFFF;
                --text-main: #000000;
                --text-secondary: #6C6C70;
                --border: #C6C6C8;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 50px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Navigasyon / Sekmeler */
        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Kart Tasarımları */
        .glass-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Elemanları */
        .input-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(120, 120, 128, 0.08);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.4);
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.7;
        }

        /* Tablo Yapıları */
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            padding: 10px 12px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-active {
            background: rgba(255, 214, 10, 0.15);
            color: var(--warning);
            border: 1px solid rgba(255, 214, 10, 0.3);
        }

        .badge-done {
            background: rgba(50, 215, 75, 0.15);
            color: var(--success);
            border: 1px solid rgba(50, 215, 75, 0.3);
        }

        .btn-action {
            background: var(--success);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .stats-box {
            display: flex;
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid rgba(10, 132, 255, 0.3);
            border-radius: 10px;
            padding: 14px;
            margin-top: 14px;
            justify-content: space-between;
            align-items: center;
        }

        .stats-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stats-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>FS Nakliyat</h1>
        <span style="font-size: 12px; color: var(--text-secondary);" id="topTarih"></span>
    </header>

    <!-- Navigasyon Sekmeleri -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('seferler')">Seferler</button>
        <button class="tab-btn" onclick="switchTab('araclar')">Araçlar</button>
        <button class="tab-btn" onclick="switchTab('gecmis')">Geçmiş & Rapor</button>
    </div>

    <!-- 1. SEFERLER BÖLÜMÜ -->
    <div id="sec-seferler" class="view-section active">
        <div class="glass-card">
            <div class="card-title">✨ Yeni Sefer Çıkışı</div>
            
            <div class="input-group">
                <label>Aktif Araç</label>
                <select id="seferPlakaSec">
                    <option value="">Önce araç ekleyin</option>
                </select>
            </div>

            <div class="input-group">
                <label>Çıkış Yeri / Rota</label>
                <input type="text" id="cikisYeri" placeholder="Örn: İstanbul -> Antalya">
            </div>

            <div class="input-group">
                <label>Çıkış Kilometresi (KM)</label>
                <input type="number" id="cikisKm" placeholder="Örn: 124500">
            </div>

            <button class="btn-primary" onclick="yeniSeferBaslat()">Çıkış Kaydı Oluştur</button>
        </div>

        <div class="glass-card">
            <div class="card-title">📋 Aktif ve Son Seferler</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Araç / Rota</th>
                            <th>Çıkış KM</th>
                            <th>Dönüş KM</th>
                            <th>Toplam</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="seferlerTabloBody">
                        <!-- Dinamik Dolacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 2. ARAÇLAR BÖLÜMÜ -->
    <div id="sec-araclar" class="view-section">
        <div class="glass-card">
            <div class="card-title">🚛 Filo Yönetimi</div>
            
            <div class="input-group">
                <label>Araç Plakası</label>
                <input type="text" id="yeniPlaka" placeholder="Örn: 34ABC123" style="text-transform: uppercase;">
            </div>

            <div class="input-group">
                <label>Araç Model / Detay</label>
                <input type="text" id="aracModel" placeholder="Örn: Iveco Daily 5m">
            </div>

            <button class="btn-primary" onclick="aracTanimla()">Aracı Filoya Ekle</button>
        </div>

        <div class="glass-card">
            <div class="card-title">📌 Kayıtlı Araçlar</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Plaka</th>
                            <th>Model</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="araclarTabloBody">
                        <!-- Dinamik Dolacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 3. GEÇMİŞ & RAPOR BÖLÜMÜ -->
    <div id="sec-gecmis" class="view-section">
        <div class="glass-card">
            <div class="card-title">📊 Araç Bazlı Sefer Geçmişi</div>
            
            <div class="input-group">
                <label>İncelenecek Araç</label>
                <select id="gecmisPlakaSec" onchange="aracGecmisiniYukle()">
                    <option value="">Araç Seçin</option>
                </select>
            </div>

            <div class="stats-box">
                <span class="stats-label">Toplam Yapılan Yol</span>
                <span class="stats-value" id="toplamYolGosterge">0 KM</span>
            </div>

            <div class="table-container" style="margin-top: 14px;">
                <table>
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Rota</th>
                            <th>Çıkış</th>
                            <th>Dönüş</th>
                            <th>Toplam</th>
                        </tr>
                    </thead>
                    <tbody id="gecmisTabloBody">
                        <!-- Dinamik Dolacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Tarih atama
    document.getElementById('topTarih').innerText = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

    // Bellek verileri
    let araclar = JSON.parse(localStorage.getItem('fs_araclar')) || [];
    let seferler = JSON.parse(localStorage.getItem('fs_seferler')) || [];

    function verileriKaydet() {
        localStorage.setItem('fs_araclar', JSON.stringify(araclar));
        localStorage.setItem('fs_seferler', JSON.stringify(seferler));
        arayuzuYenile();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
        
        if(tabName === 'seferler') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('sec-seferler').classList.add('active');
        } else if(tabName === 'araclar') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('sec-araclar').classList.add('active');
        } else if(tabName === 'gecmis') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('sec-gecmis').classList.add('active');
        }
    }

    function aracTanimla() {
        let plakaInput = document.getElementById('yeniPlaka');
        let modelInput = document.getElementById('aracModel');
        let plaka = plakaInput.value.toUpperCase().trim();
        let model = modelInput.value.trim();

        if(!plaka) {
            alert("Lütfen araç plakasını boş bırakmayın.");
            return;
        }

        if(araclar.some(a => a.plaka === plaka)) {
            alert("Bu plaka sistemde zaten kayıtlı.");
            return;
        }

        araclar.push({ plaka, model });
        plakaInput.value = '';
        modelInput.value = '';
        verileriKaydet();
    }

    function aracSil(plaka) {
        if(confirm(`${plaka} plakalı aracı sistemden silmek istiyor musunuz?`)) {
            araclar = araclar.filter(a => a.plaka !== plaka);
            verileriKaydet();
        }
    }

    function yeniSeferBaslat() {
        let plaka = document.getElementById('seferPlakaSec').value;
        let yer = document.getElementById('cikisYeri').value.trim();
        let cikisKm = parseFloat(document.getElementById('cikisKm').value);

        if(!plaka || !yer || isNaN(cikisKm)) {
            alert("Lütfen tüm alanları eksiksiz doldurun.");
            return;
        }

        let yeniSefer = {
            id: Date.now(),
            plaka,
            yer,
            tarih: new Date().toLocaleDateString('tr-TR'),
            cikisKm,
            donusKm: null,
            toplamKm: null
        };

        seferler.unshift(yeniSefer);
        document.getElementById('cikisYeri').value = '';
        document.getElementById('cikisKm').value = '';
        verileriKaydet();
    }

    function donusKilometresiAl(id) {
        let sefer = seferler.find(s => s.id === id);
        if(!sefer) return;

        let giris = prompt(`${sefer.plaka} (${sefer.yer}) için Dönüş Kilometresini giriniz:`, sefer.cikisKm);
        if(giris === null) return;

        let donusKm = parseFloat(giris);
        if(isNaN(donusKm) || donusKm < sefer.cikisKm) {
            alert("Hata: Dönüş kilometresi çıkış kilometresinden düşük olamaz!");
            return;
        }

        sefer.donusKm = donusKm;
        sefer.toplamKm = donusKm - sefer.cikisKm;
        verileriKaydet();
    }

    function arayuzuYenile() {
        // Araç Seçim Kutuları
        let sel1 = document.getElementById('seferPlakaSec');
        let sel2 = document.getElementById('gecmisPlakaSec');
        let val1 = sel1.value;
        let val2 = sel2.value;

        sel1.innerHTML = '<option value="">Araç Seçiniz</option>';
        sel2.innerHTML = '<option value="">Araç Seçiniz</option>';

        let aracBody = document.getElementById('araclarTabloBody');
        aracBody.innerHTML = araclar.length === 0 ? '<tr><td colspan="3" style="text-align:center; color:var(--text-secondary);">Kayıtlı araç bulunmuyor</td></tr>' : '';

        araclar.forEach(a => {
            sel1.innerHTML += `<option value="${a.plaka}">${a.plaka} ${a.model ? '- '+a.model : ''}</option>`;
            sel2.innerHTML += `<option value="${a.plaka}">${a.plaka} ${a.model ? '- '+a.model : ''}</option>`;
            aracBody.innerHTML += `
                <tr>
                    <td><strong>${a.plaka}</strong></td>
                    <td>${a.model || '-'}</td>
                    <td><button class="btn-danger" onclick="aracSil('${a.plaka}')">Sil</button></td>
                </tr>
            `;
        });

        sel1.value = val1;
        sel2.value = val2;

        // Seferler Tablosu
        let seferBody = document.getElementById('seferlerTabloBody');
        seferBody.innerHTML = seferler.length === 0 ? '<tr><td colspan="5" style="text-align:center; color:var(--text-secondary);">Henüz sefer kaydı yok</td></tr>' : '';

        seferler.forEach(s => {
            let islemHTML = s.donusKm === null 
                ? `<button class="btn-action" onclick="donusKilometresiAl(${s.id})">Dönüş Gir</button>` 
                : `<span class="badge badge-done">Tamamlandı</span>`;

            seferBody.innerHTML += `
                <tr>
                    <td><strong>${s.plaka}</strong><br><small style="color:var(--text-secondary);">${s.yer}</small></td>
                    <td>${s.cikisKm.toLocaleString()}</td>
                    <td>${s.donusKm !== null ? s.donusKm.toLocaleString() : '-'}</td>
                    <td><strong>${s.toplamKm !== null ? s.toplamKm.toLocaleString() + ' km' : '-'}</strong></td>
                    <td>${islemHTML}</td>
                </tr>
            `;
        });

        aracGecmisiniYukle();
    }

    function aracGecmisiniYukle() {
        let secilenPlaka = document.getElementById('gecmisPlakaSec').value;
        let gecmisBody = document.getElementById('gecmisTabloBody');
        gecmisBody.innerHTML = '';

        if(!secilenPlaka) {
            document.getElementById('toplamYolGosterge').innerText = '0 KM';
            gecmisBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-secondary);">Lütfen yukarıdan araç seçin</td></tr>';
            return;
        }

        let filtrelenenSeferler = seferler.filter(s => s.plaka === secilenPlaka);
        let toplamYol = 0;

        if(filtrelenenSeferler.length === 0) {
            gecmisBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-secondary);">Bu araca ait geçmiş sefer bulunamadı</td></tr>';
            document.getElementById('toplamYolGosterge').innerText = '0 KM';
            return;
        }

        filtrelenenSeferler.forEach(s => {
            if(s.toplamKm !== null) toplamYol += s.toplamKm;
            gecmisBody.innerHTML += `
                <tr>
                    <td><small>${s.tarih}</small></td>
                    <td>${s.yer}</td>
                    <td>${s.cikisKm.toLocaleString()}</td>
                    <td>${s.donusKm !== null ? s.donusKm.toLocaleString() : 'Yolda'}</td>
                    <td><strong>${s.toplamKm !== null ? s.toplamKm.toLocaleString() + ' km' : '-'}</strong></td>
                </tr>
            `;
        });

        document.getElementById('toplamYolGosterge').innerText = toplamYol.toLocaleString() + ' KM';
    }

    // İlk yükleme
    window.onload = arayuzuYenile;
</script>

</body>
</html>
